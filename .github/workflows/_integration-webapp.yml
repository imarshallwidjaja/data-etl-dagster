# =============================================================================
# Reusable Webapp Integration Tests Workflow
# =============================================================================
# Tests for the web application.
# Requires webapp plus MinIO and MongoDB services.
# =============================================================================

name: Integration - Webapp

on:
    workflow_call:

jobs:
    webapp:
        name: Webapp Tests
        runs-on: ubuntu-latest

        env:
            ENVIRONMENT: ci
            COMPOSE_PROJECT_NAME: spatial-etl-ci
            WAIT_FOR_SERVICES: minio,mongodb,webapp

            # MinIO Configuration
            MINIO_ROOT_USER: minio
            MINIO_ROOT_PASSWORD: minio_password
            MINIO_ENDPOINT: localhost:9000
            MINIO_USE_SSL: "false"
            MINIO_LANDING_BUCKET: landing-zone
            MINIO_LAKE_BUCKET: data-lake

            # MongoDB Configuration
            MONGO_INITDB_ROOT_USERNAME: mongo
            MONGO_INITDB_ROOT_PASSWORD: mongo_password
            MONGO_HOST: localhost
            MONGO_PORT: "27017"
            MONGO_DATABASE: spatial_etl

            # Logging
            LOG_LEVEL: INFO

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Read pinned uv version
              id: uv_version
              run: |
                  echo "value=$(tr -d '[:space:]' < .uv-version)" >> "$GITHUB_OUTPUT"

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: ${{ steps.uv_version.outputs.value }}

            - name: Install dependencies
              run: |
                  uv sync --frozen --group test

            - name: Start webapp services
              run: |
                  docker compose -f compose.yaml -f compose.test.yaml up -d --build \
                    webapp minio minio-init mongodb

            - name: Wait for services
              run: |
                  docker compose -f compose.yaml -f compose.test.yaml run --rm --no-deps -e WAIT_FOR_SERVICES test-runner \
                    uv run python scripts/wait_for_services.py

            - name: Run webapp integration tests
              uses: nick-fields/retry@v2
              with:
                  max_attempts: 2
                  timeout_minutes: 10
                  command: |
                      docker compose -f compose.yaml -f compose.test.yaml run --rm --no-deps test-runner \
                        uv run pytest tests/integration/test_webapp*.py -v --tb=short

            - name: Dump logs on failure
              if: failure()
              run: |
                  echo "=== Webapp Logs ==="
                  docker compose -f compose.yaml -f compose.test.yaml logs webapp || true
                  echo ""
                  echo "=== MinIO Logs ==="
                  docker compose -f compose.yaml -f compose.test.yaml logs minio || true
                  echo ""
                  echo "=== MongoDB Logs ==="
                  docker compose -f compose.yaml -f compose.test.yaml logs mongodb || true

            - name: Cleanup
              if: always()
              run: |
                  docker compose -f compose.yaml -f compose.test.yaml down -v
