# =============================================================================
# Reusable Unit Tests Workflow
# =============================================================================
# Fast unit tests that don't require Docker services.
# =============================================================================

name: Unit Tests

on:
    workflow_call:

jobs:
    unit:
        name: Run Unit Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Read pinned uv version
              id: uv_version
              run: |
                  echo "value=$(tr -d '[:space:]' < .uv-version)" >> "$GITHUB_OUTPUT"

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: ${{ steps.uv_version.outputs.value }}

            - name: Install dependencies
              run: |
                  uv sync --frozen --group test

            - name: Run unit tests
              run: |
                  uv run pytest tests/unit -v --tb=short
              timeout-minutes: 10
