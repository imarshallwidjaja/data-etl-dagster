# =============================================================================
# Reusable ETL Integration Tests Workflow
# =============================================================================
# Tests for Dagster pipelines, sensors, and transformations.
# Requires full Dagster stack plus infrastructure services.
# =============================================================================

name: Integration - ETL

on:
  workflow_call:

jobs:
  etl:
    name: ETL Pipeline Tests
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ci
      COMPOSE_PROJECT_NAME: spatial-etl-ci

      # MinIO Configuration
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_password
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
      MINIO_LANDING_BUCKET: landing-zone
      MINIO_LAKE_BUCKET: data-lake

      # MongoDB Configuration
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DATABASE: spatial_etl

      # PostGIS Configuration
      POSTGRES_USER: postgis
      POSTGRES_PASSWORD: postgis_password
      POSTGRES_DB: spatial_compute
      POSTGRES_HOST: postgis
      POSTGRES_PORT: "5432"

      # Dagster Configuration
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster_password
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: dagster-postgres
      DAGSTER_POSTGRES_PORT: "5433"
      DAGSTER_WEBSERVER_HOST: dagster-webserver
      DAGSTER_WEBSERVER_PORT: "3000"

      # Service wait timeout
      SERVICE_WAIT_TIMEOUT: "120"

      # Stability checks use compose service names with project prefix
      CHECK_CONTAINERS: spatial-etl-ci-dagster-webserver-1,spatial-etl-ci-dagster-daemon-1,spatial-etl-ci-user-code-1,spatial-etl-ci-mongodb-1,spatial-etl-ci-postgis-1,spatial-etl-ci-minio-1

      # Logging
      LOG_LEVEL: INFO

      # Service check configuration (exclude webapp for ETL tests)
      WAIT_FOR_SERVICES: minio,mongodb,postgis,dagster,user-code

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Read pinned uv version
        id: uv_version
        run: |
          echo "value=$(tr -d '[:space:]' < .uv-version)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ steps.uv_version.outputs.value }}

      - name: Install dependencies
        run: |
          uv sync --frozen --group test

      - name: Start Docker stack
        run: |
          docker compose -f compose.yaml -f compose.test.yaml up -d --build \
            dagster-webserver dagster-daemon user-code minio minio-init mongodb postgis dagster-postgres

      - name: Wait for services
        run: |
          docker compose -f compose.yaml -f compose.test.yaml run --rm --no-deps -e WAIT_FOR_SERVICES test-runner \
            uv run python scripts/wait_for_services.py
        timeout-minutes: 5

      - name: Check container stability
        id: stability_check
        run: |
          uv run python scripts/check_container_stability.py > unstable_containers.txt 2>&1 || STABILITY_EXIT=$?
          if [ ${STABILITY_EXIT:-0} -ne 0 ]; then
            echo "stability_failed=true" >> $GITHUB_OUTPUT
            cat unstable_containers.txt
            exit 1
          else
            echo "stability_failed=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
        timeout-minutes: 2

      - name: Dump logs for unstable containers
        if: ${{ steps.stability_check.outcome == 'failure' || steps.stability_check.outputs.stability_failed == 'true' }}
        run: |
          echo "=== Unstable Container Logs ==="
          if [ -f unstable_containers.txt ]; then
            in_section=false
            while IFS= read -r line; do
              if [[ "$line" == *"Unstable containers"* ]]; then
                in_section=true
                continue
              fi
              if [ "$in_section" = true ] && [ -n "$line" ] && [[ "$line" != *"==="* ]] && [[ "$line" != "FAILED"* ]] && [[ "$line" != "SUCCESS"* ]]; then
                echo ""
                echo "=== Logs for $line ==="
                docker logs "$line" || true
              fi
            done < unstable_containers.txt
          fi

      - name: Run ETL integration tests
        uses: nick-fields/retry@v2
        with:
          max_attempts: 2
          timeout_minutes: 15
          command: |
            docker compose -f compose.yaml -f compose.test.yaml run --rm --no-deps test-runner \
              uv run pytest -m "integration and not e2e" \
                     tests/integration/test_dagster*.py \
                     tests/integration/test_sensor*.py \
                     tests/integration/test_schema*.py \
                     tests/integration/test_gdal*.py \
                     -v --tb=short

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== Dagster Webserver Logs ==="
          docker compose -f compose.yaml -f compose.test.yaml logs dagster-webserver || true
          echo ""
          echo "=== Dagster Daemon Logs ==="
          docker compose -f compose.yaml -f compose.test.yaml logs dagster-daemon || true
          echo ""
          echo "=== User Code Logs ==="
          docker compose -f compose.yaml -f compose.test.yaml logs user-code || true
          echo ""
          echo "=== All Container Status ==="
          docker compose -f compose.yaml -f compose.test.yaml ps || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.test.yaml down -v
