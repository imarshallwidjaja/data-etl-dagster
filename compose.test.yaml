# =============================================================================
# Spatial Data ETL Pipeline - Test Overlay
# =============================================================================
# Use with:  docker compose -f compose.yaml -f compose.test.yaml -p <project> ...
#
# The explicit -f flags prevent auto-loading compose.override.yaml, so no host
# ports are exposed and no container_name conflicts arise.  This allows the
# test stack to run alongside the dev stack under a separate -p project name.
# =============================================================================

services:
  test-runner:
    build:
      context: .
      dockerfile: services/test_runner/Dockerfile
    networks:
      - etl-network
    environment:
      # --- DNS overrides: point tests at in-network service names ---
      DAGSTER_GRAPHQL_URL: http://dagster-webserver:3000/graphql
      WEBAPP_URL: http://webapp:8080
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
      MINIO_USE_SSL: "false"
      MINIO_LANDING_BUCKET: ${MINIO_LANDING_BUCKET:-landing-zone}
      MINIO_LAKE_BUCKET: ${MINIO_LAKE_BUCKET:-data-lake}
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongo_password}
      MONGO_DATABASE: ${MONGO_DATABASE:-spatial_etl}
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-admin}
      POSTGRES_HOST: postgis
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgis_password}
      POSTGRES_DB: ${POSTGRES_DB:-spatial_compute}
    depends_on:
      dagster-webserver:
        condition: service_healthy
      webapp:
        condition: service_healthy
      minio:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      postgis:
        condition: service_healthy
