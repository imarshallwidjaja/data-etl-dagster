# =============================================================================
# Spatial Data ETL Pipeline - Dev Override
# =============================================================================
# Loaded automatically by `docker compose up`.
# Adds host-exposed ports for local development.
# =============================================================================

services:
  dagster-postgres:
    ports:
      - "5433:5432"

  dagster-webserver:
    ports:
      - "3000:3000"

  user-code:
    ports:
      - "4000:4000"

  minio:
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console

  mongodb:
    ports:
      - "27017:27017"

  postgis:
    ports:
      - "5432:5432"

  webapp:
    ports:
      - "8080:8080"
